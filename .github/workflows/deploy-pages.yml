name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  cloudflare:
    if: ${{ vars.CLOUDFLARE_D1_DATABASE_ID != '' && vars.VITE_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate protected Cloudflare settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LEVELUP_ADMIN_PASSWORD: ${{ secrets.LEVELUP_ADMIN_PASSWORD }}
        run: node -e "for (const key of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','LEVELUP_ADMIN_PASSWORD']) if (!process.env[key]) process.exit(1)"
      - name: Prepare Worker configuration
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          LEVELUP_SITE_ORIGIN: https://dgdfurkan.github.io
          LEVELUP_ADMIN_USERNAME: ${{ vars.LEVELUP_ADMIN_USERNAME }}
        run: node scripts/prepare-worker-config.mjs
      - name: Build curriculum security manifest
        run: npm run check:worker
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.133.0 d1 migrations apply DB --remote --config worker/wrangler.ci.toml
      - name: Deploy free backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.133.0 deploy --config worker/wrangler.ci.toml
      - name: Generate protected secrets and create admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          LEVELUP_ADMIN_USERNAME: ${{ vars.LEVELUP_ADMIN_USERNAME }}
          LEVELUP_ADMIN_PASSWORD: ${{ secrets.LEVELUP_ADMIN_PASSWORD }}
        run: |
          if ! npx --yes wrangler@4.133.0 secret list --config worker/wrangler.ci.toml | grep -q 'AUTH_PEPPER'; then
            AUTH_PEPPER="$(openssl rand -base64 48 | tr -d '\n')"
            echo "::add-mask::$AUTH_PEPPER"
            printf '%s' "$AUTH_PEPPER" | npx --yes wrangler@4.133.0 secret put AUTH_PEPPER --config worker/wrangler.ci.toml
          fi
          BOOTSTRAP_TOKEN="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$BOOTSTRAP_TOKEN"
          printf '%s' "$BOOTSTRAP_TOKEN" | npx --yes wrangler@4.133.0 secret put BOOTSTRAP_TOKEN --config worker/wrangler.ci.toml
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/admin.json', JSON.stringify({username: process.env.LEVELUP_ADMIN_USERNAME || 'admin', password: process.env.LEVELUP_ADMIN_PASSWORD}))"
          curl --fail-with-body --silent --show-error --request PUT "$API_BASE_URL/api/setup/admin" --header "Content-Type: application/json" --header "X-Setup-Token: $BOOTSTRAP_TOKEN" --data-binary "@${RUNNER_TEMP}/admin.json"
